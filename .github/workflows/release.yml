name: release

# Pushing a tag v<VERSION> (for example v0.3.0) builds the firmware and the app and creates a
# draft release, for a maintainer to check and publish. Running this workflow by hand builds the
# same files and attaches them to the run, without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but VERSION says $version. Tag v$version, or update VERSION first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: firmware
          command: idf.py build && idf.py merge-bin -o puck-merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          if-no-files-found: error
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/puck.bin
            firmware/build/puck.elf
            firmware/build/puck-merged.bin
            firmware/build/flasher_args.json
            firmware/build/project_description.json

  windows:
    needs: firmware
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.firmware.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: firmware/build
      - name: Test
        run: dotnet test windows/Puck.sln -c Release
      - name: Package the app with this firmware
        shell: pwsh
        run: ./scripts/build.ps1 -SkipFirmware
      - name: Collect the release files
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/Puck-win-x64.zip "release/Puck-$v-win-x64.zip"
          Compress-Archive -Path web/firmware/* -DestinationPath "release/puck-firmware-$v.zip"
          Copy-Item firmware/build/puck-merged.bin "release/puck-firmware-$v-merged.bin"
          Copy-Item firmware/build/puck.elf "release/puck-$v.elf"
          $sums = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content release/SHA256SUMS.txt -Value $sums -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [firmware, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.firmware.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: release
      - name: Create a draft release
        run: |
          cat > notes.md <<NOTES
          **Install:** download \`Puck-$VERSION-win-x64.zip\`, unzip it, and run \`Puck.exe\`. Then install the firmware from *Settings → Firmware* in the app, or from the [web installer](https://tank104.github.io/gyrodial/). The app isn't code-signed yet, so Windows SmartScreen may warn you: choose *More info → Run anyway*.

          **Other files:** \`puck-firmware-$VERSION.zip\` has the flash images and an ESP Web Tools manifest. \`puck-firmware-$VERSION-merged.bin\` is one image to write at \`0x0\` with any flashing tool. \`puck-$VERSION.elf\` decodes crash dumps. \`SHA256SUMS.txt\` has the checksums.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "Puck $VERSION" --notes-file notes.md --generate-notes
