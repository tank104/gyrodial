name: build

# Every pull request (and every push to main) runs all the checks, and a pull request can only be
# merged once both jobs pass:
#   firmware: builds the firmware with ESP-IDF, then builds the face simulator from the same UI code
#             and renders every face (attached to the run as "faces").
#   windows:  builds the app, runs the unit tests, then runs Gyrodial.exe --self-test (the connection
#             logic against a fake dial).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
            firmware/build/gyrodial.bin
            firmware/build/flasher_args.json
      - name: Face simulator (renders every face)
        working-directory: firmware/tools/sim
        run: |
          ./build.sh
          ./build/sim.exe -q
      - uses: actions/upload-artifact@v4
        with:
          name: faces
          path: firmware/tools/sim/out/sheet.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build windows/Gyrodial.sln -c Release
      - name: Unit tests
        run: dotnet test windows/Gyrodial.sln -c Release --no-build
      - name: Self-test (connection logic against a fake dial)
        shell: pwsh
        run: |
          # Gyrodial.exe is a GUI app: start it and wait, with its output going to a file
          $exe = Resolve-Path windows/src/Gyrodial.App/bin/Release/net10.0-windows10.0.22621.0/Gyrodial.exe
          $out = Join-Path $env:RUNNER_TEMP selftest.txt
          $p = Start-Process -FilePath $exe -ArgumentList --self-test -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          exit $p.ExitCode
